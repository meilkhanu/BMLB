# /etc/nginx/sites-enabled/bmlb   ← 本文件在仓库中维护：deploy/nginx/bmlb.conf
# 2026-10-18 优化：静态资源直供 + 文本资源 gzip + 安全响应头 + robots.txt
# 服务器上改动前请先备份到 /root/nginx-backup/（不要放 sites-enabled/，会被一起加载导致 server_name 冲突）
server {
    server_name bmlb.online www.bmlb.online;
    client_max_body_size 50M;

    set $clean_host $host;
    if ($host ~ "^0*(\d+)\.0*(\d+)\.0*(\d+)\.0*(\d+)$") {
        set $clean_host "$1.$2.$3.$4";
    }

    # ---- 安全响应头（server 级：所有未自定义 add_header 的 location 继承） ----
    include /etc/nginx/snippets/bmlb-security.conf;

    # ---- 压缩：只压文本型资源（woff2/mp4/avif 本身已压缩，不重复压） ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;

    # ---- 构建产物直供（文件名带 hash，可永久缓存） ----
    location /_astro/ {
        root /var/www/bmlb/dist/client;
        try_files $uri @node;
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /fonts/ {
        root /var/www/bmlb/dist/client;
        try_files $uri @node;
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /lab-apps/ {
        root /var/www/bmlb/dist/client;
        try_files $uri @node;
    }

    # ---- 手写经典脚本：非 Astro 打包，靠 BaseLayout 里的 ?v= 破缓存 ----
    location /js/ {
        root /var/www/bmlb/dist/client;
        try_files $uri @node;
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- public/ 下的非哈希资源 ----
    location /images/ {
        root /var/www/bmlb/public;
        try_files $uri @node;
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- 用户上传（时间戳+随机串命名，可长缓存） ----
    location /uploads/ {
        root /var/www/bmlb/data;
        try_files $uri @node;
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # robots.txt 内容由仓库 public/robots.txt 提供（构建后落在 dist/client）
    location = /robots.txt {
        root /var/www/bmlb/dist/client;
        try_files $uri @node;
    }

    # ---- 后台：不索引 ----
    location ^~ /admin {
        include /etc/nginx/snippets/bmlb-security.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $clean_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $clean_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态文件缺失时回退给 Node（保证不会因新构建缺文件而 404）
    location @node {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $clean_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bmlb.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bmlb.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.bmlb.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = bmlb.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name bmlb.online www.bmlb.online;
    return 404; # managed by Certbot
}
