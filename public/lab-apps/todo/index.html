<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单 ✦</title>
<style>
:root{
  --purple:#8B7CB3;
  --pink:#FF6B9D;
  --ink:#3d3a4a;
  --ink-soft:#8a8598;
  --card:rgba(255,255,255,.66);
  --card-border:rgba(255,255,255,.85);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#f5f0ff 0%,#fdf0f6 55%,#f7f2ff 100%);
  min-height:100vh;
  overflow-x:hidden;
}
/* ── 背景装饰 ── */
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.orb-1{width:340px;height:340px;background:#d9cdf5;top:-120px;right:-80px}
.orb-2{width:280px;height:280px;background:#ffd1e2;bottom:-100px;left:-90px}
.orb-3{width:200px;height:200px;background:#e6dcff;top:40%;left:60%;opacity:.35}

.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:36px 18px 120px}

/* ── 顶栏 ── */
header{text-align:center;margin-bottom:22px}
header h1{
  font-size:30px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(120deg,var(--purple),var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header .date{font-size:13px;color:var(--ink-soft);margin-top:6px;letter-spacing:1px}
header .sub{font-size:11px;color:#b3aec9;margin-top:3px;letter-spacing:3px;text-transform:uppercase}

/* ── 进度卡片 ── */
.progress-card{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);border-radius:22px;
  box-shadow:0 10px 30px -14px rgba(139,124,179,.35);
  padding:18px 20px;margin-bottom:20px;
}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress-top .stat{font-size:13px;color:var(--ink-soft)}
.progress-top .stat b{font-size:20px;color:var(--ink);font-weight:800}
.progress-top .pct{font-size:13px;font-weight:700;color:var(--purple)}
.progress-bar{height:8px;background:rgba(139,124,179,.15);border-radius:99px;overflow:hidden}
.progress-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--purple),var(--pink));
  transition:width .6s cubic-bezier(.22,.61,.36,1);
}

/* ── 筛选 tabs ── */
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{
  flex:1;padding:9px 0;border:none;border-radius:99px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--ink-soft);
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);
  transition:all .3s var(--spring);font-family:inherit;
}
.tab:hover{transform:translateY(-1px);color:var(--purple)}
.tab.active{
  background:linear-gradient(120deg,var(--purple),var(--pink));color:#fff;
  border-color:transparent;box-shadow:0 6px 16px -6px rgba(139,124,179,.5);
}

/* ── 专注模式开关 ── */
.focus-row{
  display:flex;align-items:center;justify-content:space-between;
  margin:-4px 4px 16px;padding:10px 14px;border-radius:14px;
  background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);
}
.focus-label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:1px}
.focus-label b{color:var(--purple)}
.switch{
  position:relative;width:46px;height:25px;border-radius:99px;flex-shrink:0;
  background:rgba(139,124,179,.25);border:none;cursor:pointer;
  transition:background .35s;font-family:inherit;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);
  transition:transform .35s var(--spring);
}
.switch.on{background:linear-gradient(90deg,var(--purple),var(--pink))}
.switch.on::after{transform:translateX(21px)}

/* ── 折叠区（长期/低优先） ── */
.fold{margin-bottom:10px}
.fold summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:600;color:#b3aec9;padding:11px 14px;border-radius:14px;
  background:rgba(255,255,255,.35);border:1.5px dashed rgba(139,124,179,.35);
  transition:all .3s var(--spring);user-select:none;
}
.fold summary:hover{color:var(--purple);border-color:var(--purple)}
.fold summary::-webkit-details-marker{display:none}
.fold summary .arrow{font-size:9px;transition:transform .3s}
.fold[open] summary .arrow{transform:rotate(90deg)}
.fold-inner{margin-top:8px}
.focus-empty{
  text-align:center;padding:26px 16px;color:#b3aec9;font-size:13px;letter-spacing:1px;
  background:rgba(255,255,255,.4);border:1.5px dashed rgba(139,124,179,.3);
  border-radius:18px;margin-bottom:10px;
}

/* ── 分组标题 ── */
.group-title{
  display:flex;align-items:center;gap:10px;
  margin:22px 0 10px;text-transform:uppercase;letter-spacing:2px;
}
.group-title .en{font-size:10px;color:#b3aec9;font-weight:700}
.group-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(139,124,179,.3),transparent)}

/* ── 待办卡片 ── */
.todo{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);border-radius:18px;
  box-shadow:0 6px 20px -12px rgba(139,124,179,.3);
  padding:14px 16px;margin-bottom:10px;
  transition:transform .35s var(--spring),box-shadow .35s var(--spring),opacity .3s;
  animation:popIn .45s var(--spring) both;
}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.todo:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(139,124,179,.42)}
.todo.done{opacity:.55}
.todo.done .title{text-decoration:line-through;color:var(--ink-soft)}

/* checkbox */
.ck{position:relative;width:22px;height:22px;flex-shrink:0;margin-top:1px;cursor:pointer}
.ck input{opacity:0;position:absolute;inset:0;cursor:pointer;margin:0}
.ck .box{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(139,124,179,.55);
  transition:all .3s var(--spring);display:flex;align-items:center;justify-content:center;
}
.ck .box::after{
  content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .25s var(--spring);
}
.ck input:checked ~ .box{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  border-color:transparent;transform:scale(1.05);
  box-shadow:0 4px 10px -3px rgba(255,107,157,.55);
}
.ck input:checked ~ .box::after{transform:rotate(45deg) scale(1)}
.ck input:active ~ .box{transform:scale(.85)}

/* 内容 */
.body{flex:1;min-width:0}
.title{font-size:15px;font-weight:600;line-height:1.5;word-break:break-word;cursor:text}
.title .due{font-size:12px;font-weight:400;color:var(--ink-soft);margin-left:8px}
.title .due.over{color:#e5484d;font-weight:600}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{
  font-size:10px;padding:2px 9px;border-radius:99px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;
}
.chip-work{background:rgba(139,124,179,.16);color:#6f63a0}
.chip-personal{background:rgba(255,107,157,.14);color:#d94e7e}
.chip-side{background:rgba(94,168,138,.16);color:#3e8a6a}
.dot{width:7px;height:7px;border-radius:50%}
.dot-1{background:var(--pink)}
.dot-2{background:#d9a441}
.dot-3{background:#c2bdd6}
.pri-text{font-size:10px;color:var(--ink-soft)}
.note{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.5;display:none}
.todo.expanded .note{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 删除 */
.del{
  width:26px;height:26px;flex-shrink:0;border:none;border-radius:9px;cursor:pointer;
  background:transparent;color:#c9c4da;font-size:15px;line-height:1;
  opacity:0;transform:scale(.8);transition:all .25s var(--spring);font-family:inherit;
}
.todo:hover .del{opacity:1;transform:scale(1)}
.del:hover{background:rgba(229,72,77,.12);color:#e5484d}

/* 空状态 */
.empty{
  text-align:center;padding:46px 20px;color:#b3aec9;
  background:rgba(255,255,255,.4);border:1.5px dashed rgba(139,124,179,.3);
  border-radius:20px;margin-bottom:10px;
}
.empty .big{font-size:34px;margin-bottom:8px}
.empty p{font-size:13px;letter-spacing:1px}

/* ── FAB ── */
.fab{
  position:fixed;right:26px;bottom:30px;width:58px;height:58px;border-radius:50%;
  border:none;cursor:pointer;z-index:50;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;font-size:28px;font-weight:300;line-height:1;
  box-shadow:0 12px 28px -8px rgba(255,107,157,.6);
  transition:transform .3s var(--spring),box-shadow .3s;
  font-family:inherit;
}
.fab:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 16px 34px -8px rgba(255,107,157,.7)}
.fab:active{transform:scale(.92)}
.fab.open{transform:rotate(45deg)}

/* ── 弹窗表单 ── */
.overlay{
  position:fixed;inset:0;background:rgba(61,58,74,.32);backdrop-filter:blur(4px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.show{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:440px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:26px 24px;
  box-shadow:0 30px 60px -20px rgba(61,58,74,.4);
  transform:translateY(26px) scale(.95);transition:transform .4s var(--spring);
}
.overlay.show .modal{transform:none}
.modal h2{font-size:18px;font-weight:800;margin-bottom:18px;letter-spacing:1px}
.modal h2 span{color:var(--pink)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.field input[type="text"],.field input[type="date"]{
  width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(139,124,179,.25);
  font-size:14px;font-family:inherit;color:var(--ink);background:rgba(255,255,255,.8);
  outline:none;transition:border .25s,box-shadow .25s;
}
.field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,124,179,.15)}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;padding:8px 0;border-radius:10px;border:1.5px solid rgba(139,124,179,.25);
  background:transparent;font-size:12px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:all .25s var(--spring);font-family:inherit;
}
.seg button.active{border-color:transparent;color:#fff;box-shadow:0 4px 12px -4px rgba(139,124,179,.5)}
.seg .seg-1.active{background:linear-gradient(135deg,#ff8fb0,#ff6b9d)}
.seg .seg-2.active{background:linear-gradient(135deg,#a594d6,#8b7cb3)}
.seg .seg-3.active{background:linear-gradient(135deg,#6fae92,#3e8a6a)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions button{
  flex:1;padding:11px 0;border-radius:12px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .25s var(--spring);font-family:inherit;
}
.btn-save{background:linear-gradient(120deg,var(--purple),var(--pink));color:#fff;box-shadow:0 8px 18px -8px rgba(255,107,157,.6)}
.btn-save:hover{transform:translateY(-1px)}
.btn-cancel{background:rgba(139,124,179,.12);color:var(--ink-soft)}
.btn-cancel:hover{color:var(--ink)}

/* 完成区收尾 */
.footer-note{text-align:center;font-size:11px;color:#c9c4da;margin-top:26px;letter-spacing:2px}

@media(max-width:480px){
  .wrap{padding-top:26px}
  header h1{font-size:25px}
}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="wrap">
  <header>
    <h1>待办清单 ✦</h1>
    <div class="date" id="todayStr"></div>
    <div class="sub">Todo · Demo ✦ 数据只存本浏览器</div>
  </header>

  <section class="progress-card">
    <div class="progress-top">
      <div class="stat">已完成 <b id="doneCnt">0</b> / <span id="totalCnt">0</span></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="fill" style="width:0%"></div></div>
  </section>

  <div class="tabs">
    <button class="tab active" data-filter="all">全部</button>
    <button class="tab" data-filter="work">工作</button>
    <button class="tab" data-filter="personal">个人</button>
    <button class="tab" data-filter="side">网站·副业</button>
  </div>

  <div class="focus-row">
    <span class="focus-label"><b>✦ 专注模式</b> 只看近期</span>
    <button class="switch on" id="focusSwitch" aria-label="专注模式开关" title="切换专注/全部"></button>
  </div>

  <div id="list"></div>

  <div class="footer-note">✦ 双击标题可编辑 · 点击卡片看备注 ✦</div>
</div>

<button class="fab" id="fab" title="添加待办">＋</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>新待办 <span>✦</span></h2>
    <div class="field">
      <label>事项</label>
      <input type="text" id="f-title" placeholder="要做什么？" maxlength="60">
    </div>
    <div class="field">
      <label>分类</label>
      <div class="seg" id="f-cat">
        <button class="seg-1 active" data-val="work">工作</button>
        <button class="seg-2" data-val="personal">个人</button>
        <button class="seg-3" data-val="side">网站·副业</button>
      </div>
    </div>
    <div class="field">
      <label>优先级</label>
      <div class="seg" id="f-pri">
        <button class="seg-1 active" data-val="1">高</button>
        <button class="seg-2" data-val="2">中</button>
        <button class="seg-3" data-val="3">低</button>
      </div>
    </div>
    <div class="field">
      <label>截止日期（可选）</label>
      <input type="date" id="f-due">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input type="text" id="f-note" placeholder="补充说明…" maxlength="80">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="f-cancel">取消</button>
      <button class="btn-save" id="f-save">添加</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ 数据 ═══════════ */
const KEY = 'bmlb-todo-v1';
const CAT_LABEL = {work:'工作', personal:'个人', side:'网站·副业'};
const PRI_TEXT = {1:'高', 2:'中', 3:'低'};

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtCN(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(y, m-1, d);
  const now = new Date();
  const diff = Math.round((t - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  if(diff === 0) return '今天';
  if(diff === 1) return '明天';
  if(diff === -1) return '昨天';
  if(diff > 0 && diff < 7) return `还有 ${diff} 天`;
  return `${m}月${d}日`;
}

const DEFAULT_TODOS = (function(){
  const d = n => { const t = new Date(); t.setDate(t.getDate()+n);
    return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };
  return [
    {id:1,  title:'回复工作邮件',        cat:'work', pri:1, due:d(1), done:false, note:'演示数据 · 添加/勾选只存在你自己的浏览器里'},
    {id:2,  title:'写周报',              cat:'work', pri:2, due:d(3), done:false, note:''},
    {id:3,  title:'体检预约',            cat:'personal', pri:2, due:d(6), done:false, note:''},
    {id:4,  title:'读完《设计中的设计》', cat:'personal', pri:3, due:'', done:false, note:'长期待办'},
    {id:5,  title:'整理小工具清单',       cat:'side', pri:2, due:'', done:false, note:''},
    {id:6,  title:'散步 30 分钟',        cat:'personal', pri:3, due:'', done:false, note:''},
    {id:7,  title:'季度目标复盘',         cat:'work', pri:3, due:d(40), done:false, note:'远期 · 会被专注模式折叠'},
    {id:8,  title:'学做一道新菜',         cat:'personal', pri:3, due:'', done:false, note:''},
  ];
})();

let todos = [];
try{
  const raw = localStorage.getItem(KEY);
  todos = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_TODOS));
}catch(e){
  todos = JSON.parse(JSON.stringify(DEFAULT_TODOS));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(todos)); }catch(e){} }

/* ═══════════ 状态 ═══════════ */
let filter = 'all';
let focusMode = localStorage.getItem(KEY+'-focus') !== 'off';

/* 近期判定：高优先级(1)，或截止日期在14天内(含今天)，或已逾期 */
function isRecent(t, today){
  if(t.done) return true;
  if(t.pri === 1) return true;
  if(!t.due) return false;
  const dueMs = new Date(t.due+'T00:00:00').getTime();
  const todayMs = new Date(today+'T00:00:00').getTime();
  const DAY = 86400000;
  return dueMs < todayMs || (dueMs - todayMs) <= 14*DAY;
}

/* ═══════════ 渲染 ═══════════ */
const $ = s => document.querySelector(s);

function render(){
  const list = $('#list');
  const shown = todos.filter(t => filter==='all' || t.cat===filter);
  const active = shown.filter(t => !t.done);
  const finished = shown.filter(t => t.done);

  /* 进度 */
  const total = todos.length;
  const done = todos.filter(t=>t.done).length;
  $('#doneCnt').textContent = done;
  $('#totalCnt').textContent = total;
  $('#pct').textContent = total ? Math.round(done/total*100)+'%' : '0%';
  $('#fill').style.width = total ? (done/total*100)+'%' : '0%';

  let html = '';
  const today = todayISO();

  /* 进行中 */
  if(active.length){
    const today2 = today;
    const recent = focusMode ? active.filter(t => isRecent(t, today2)) : active;
    const later  = focusMode ? active.filter(t => !isRecent(t, today2)) : [];

    if(recent.length){
      html += `<div class="group-title"><span class="en">Doing</span><span class="line"></span></div>`;
      recent.sort((a,b)=> (a.pri-b.pri) || (a.due||'9999').localeCompare(b.due||'9999'));
      html += recent.map(t => cardHTML(t, today)).join('');
    }

    /* 远期折叠区 */
    if(later.length){
      html += `
      <details class="fold">
        <summary><span class="arrow">▶</span> 长期 / 低优先 · ${later.length} 项</summary>
        <div class="fold-inner">${later.sort((a,b)=> (a.pri-b.pri) || (a.due||'9999').localeCompare(b.due||'9999')).map(t => cardHTML(t, today)).join('')}</div>
      </details>`;
    }

    /* 专注模式：近期全清空 */
    if(focusMode && !recent.length && later.length){
      html += `<div class="focus-empty">近期没有待办，先歇会儿 ✧ 下方还有 ${later.length} 项长期任务</div>`;
    }
  }

  /* 已完成 */
  if(finished.length){
    html += `<div class="group-title"><span class="en">Done ✦</span><span class="line"></span></div>`;
    html += finished.map(t => cardHTML(t, today)).join('');
  }

  if(!active.length && !finished.length){
    html = `<div class="empty"><div class="big">🌙</div><p>这个分类还没有待办哦</p></div>`;
  }
  list.innerHTML = html;
}

function cardHTML(t, today){
  const over = !t.done && t.due && t.due < today;
  const dueHTML = t.due
    ? `<span class="due ${over?'over':''}">${over?'⚠ 逾期·':''}${fmtCN(t.due)}</span>`
    : '';
  return `
  <div class="todo ${t.done?'done':''}" data-id="${t.id}">
    <label class="ck">
      <input type="checkbox" ${t.done?'checked':''} aria-label="完成">
      <span class="box"></span>
    </label>
    <div class="body">
      <div class="title" title="双击编辑">${escapeHTML(t.title)}${dueHTML}</div>
      <div class="meta">
        <span class="chip chip-${t.cat}">${CAT_LABEL[t.cat]}</span>
        <span class="dot dot-${t.pri}"></span><span class="pri-text">${PRI_TEXT[t.pri]}优先级</span>
      </div>
      ${t.note ? `<div class="note">${escapeHTML(t.note)}</div>` : ''}
    </div>
    <button class="del" title="删除">✕</button>
  </div>`;
}
function escapeHTML(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════ 交互 ═══════════ */
$('#list').addEventListener('click', e => {
  const card = e.target.closest('.todo');
  if(!card) return;
  const id = Number(card.dataset.id);
  const t = todos.find(x=>x.id===id);
  if(!t) return;

  /* 勾选完成 */
  if(e.target.closest('.ck')){
    t.done = !t.done;
    save();
    if(t.done){ card.classList.add('done'); card.style.animation = 'none'; void card.offsetWidth;
      card.style.animation = 'popIn .5s var(--spring)'; }
    setTimeout(render, 260);
    return;
  }
  /* 删除 */
  if(e.target.closest('.del')){
    todos = todos.filter(x=>x.id!==id);
    save(); render();
    return;
  }
  /* 展开备注 */
  if(e.target.closest('.body')){
    card.classList.toggle('expanded');
  }
});

/* 双击标题编辑 */
$('#list').addEventListener('dblclick', e => {
  const titleEl = e.target.closest('.title');
  if(!titleEl) return;
  const card = titleEl.closest('.todo');
  const t = todos.find(x=>x.id===Number(card.dataset.id));
  if(!t) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = t.title;
  input.maxLength = 60;
  input.style.cssText = 'width:100%;border:none;outline:none;background:rgba(139,124,179,.08);border-radius:8px;padding:2px 8px;font-size:15px;font-weight:600;font-family:inherit;color:var(--ink)';
  titleEl.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const commit = ()=>{
    if(done) return; done = true;
    const v = input.value.trim();
    if(v) t.title = v;
    save(); render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
    if(ev.key==='Escape'){ done = true; render(); }
  });
});

/* 专注模式开关 */
const focusSwitch = $('#focusSwitch');
function syncFocusUI(){
  focusSwitch.classList.toggle('on', focusMode);
  document.querySelector('.focus-label').innerHTML = focusMode
    ? '<b>✦ 专注模式</b> 只看近期'
    : '<b>☁ 全部显示</b> 含长期';
}
focusSwitch.addEventListener('click', ()=>{
  focusMode = !focusMode;
  localStorage.setItem(KEY+'-focus', focusMode ? 'on' : 'off');
  syncFocusUI();
  render();
});

/* tabs */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

/* ── 弹窗 ── */
const overlay = $('#overlay');
const fab = $('#fab');
let segCat = 'work', segPri = 1;

function openModal(){
  overlay.classList.add('show');
  fab.classList.add('open');
  $('#f-title').value = '';
  $('#f-note').value = '';
  $('#f-due').value = '';
  segCat = 'work'; segPri = 1;
  document.querySelectorAll('#f-cat button').forEach((b,i)=>b.classList.toggle('active', i===0));
  document.querySelectorAll('#f-pri button').forEach((b,i)=>b.classList.toggle('active', i===0));
  setTimeout(()=>$('#f-title').focus(), 120);
}
function closeModal(){
  overlay.classList.remove('show');
  fab.classList.remove('open');
}
fab.addEventListener('click', ()=> overlay.classList.contains('show') ? closeModal() : openModal());
$('#f-cancel').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* segmented */
$('#f-cat').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  segCat = b.dataset.val;
  document.querySelectorAll('#f-cat button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
});
$('#f-pri').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  segPri = Number(b.dataset.val);
  document.querySelectorAll('#f-pri button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
});

/* 保存 */
$('#f-save').addEventListener('click', ()=>{
  const title = $('#f-title').value.trim();
  if(!title){ $('#f-title').focus(); $('#f-title').style.borderColor='#e5484d'; return; }
  todos.push({
    id: Date.now(),
    title,
    cat: segCat,
    pri: segPri,
    due: $('#f-due').value || '',
    note: $('#f-note').value.trim(),
    done: false
  });
  save(); closeModal(); render();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ═══════════ 启动 ═══════════ */
(function(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'][d.getDay()];
  $('#todayStr').textContent = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 周${week}`;
  syncFocusUI();
  render();
})();
</script>
</body>
