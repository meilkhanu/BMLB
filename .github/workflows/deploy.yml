name: Deploy to ECS

on:
  push:
    branches: [isNode]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            set -e
            cd /var/www/bmlb

            echo "=== Pull 最新代码 ==="
            git config http.version HTTP/1.1
            git reset --hard HEAD
            git clean -fd -e data
            # --force 必须加：本地 isNode 与 origin/isNode 一旦有分歧，
            # 不带 --force 的 fetch 会静默跳过 origin/isNode 的 ref 更新
            #（表现为「fetch 成功但 checkout 后还是旧提交」）。
            git fetch origin isNode --force
            git checkout -B isNode origin/isNode

            echo "=== 安装依赖 ==="
            npm install --legacy-peer-deps

            echo "=== 构建 ==="
            npm run build:ecs

            echo "=== 重启服务 ==="
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            echo "=== 部署完成 ==="
            pm2 list
